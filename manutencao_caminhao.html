<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>HuberHorti - Caminhão</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="utils.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F2F4F8;color:#1C1C1E;height:100vh;height:calc(var(--vh,1vh)*100);overflow:hidden;overscroll-behavior-y:none;}
.supercard{background:#fff;border-radius:44px 44px 0 0;height:100%;display:flex;flex-direction:column;}

.topbar{height:56px;padding:0 18px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-copy{display:flex;flex-direction:column;align-items:center;text-align:center;flex-grow:1;}
.topbar-title{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:#1C1C1E;}
.topbar-sub{font-size:10px;color:#8E8E93;font-weight:500;}
.ios-btn-float{width:38px;height:38px;border-radius:50%;border:0.5px solid rgba(0,0,0,0.06);background:#FFF;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.14);cursor:pointer;}

.lista-card{flex:1;margin:10px 16px 0;background:#FFF;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.12);border:0.5px solid rgba(0,0,0,0.06);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.lista-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.swipe-wrap{position:relative;overflow:hidden;border-bottom:0.5px solid #C0C0C0;}
.swipe-wrap:last-child{border-bottom:none;}
.swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;z-index:0;}
.swipe-btn{width:80px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#FFF;cursor:pointer;}
.swipe-btn.excluir{background:#EF4444;}
.lanc-row{display:flex;align-items:center;padding:12px 16px;cursor:pointer;gap:10px;background:#FFF;position:relative;z-index:1;transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);}
.lanc-row:active{background:#F5F5F5;}
.lanc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.lanc-desc{font-size:14px;font-weight:600;color:#1C1C1E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lanc-detalhe{font-size:11px;color:#8E8E93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lanc-data{font-size:10px;color:#8E8E93;}
.dias{flex-shrink:0;min-width:58px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.dias-num{font-size:20px;font-weight:700;line-height:1;color:#059669;}
.dias-txt{font-size:9px;color:#8E8E93;text-transform:uppercase;letter-spacing:0.4px;}
.dias.alerta .dias-num{color:#E07B00;}
.dias.vencido .dias-num{color:#EF4444;}

.paginacao{display:flex;align-items:center;justify-content:center;padding:10px 16px 14px;flex-shrink:0;border-top:0.5px solid #E0E0E0;}
.pag-btns{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;}
.pag-btn-nav{height:28px;padding:0 10px;border-radius:6px;border:1px solid #D1D1D6;background:#FFF;font-size:11px;font-weight:500;color:#1C1C1E;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0;font-family:'Inter',sans-serif;}
.pag-btn-nav:disabled{color:#C7C7CC;border-color:#E5E5EA;pointer-events:none;}
.pag-num{width:28px;height:28px;border-radius:6px;border:1px solid #D1D1D6;background:#FFF;font-size:11px;font-weight:500;color:#1C1C1E;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Inter',sans-serif;}
.pag-num.ativo{background:#E53E3E;border-color:#E53E3E;color:#FFF;}
.empty-state{height:100%;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#C7C7CC;}

.sheet-overlay{position:fixed;inset:0;background:transparent;z-index:9992;display:none;align-items:center;justify-content:center;padding:24px;}
.sheet-overlay.active{display:flex;}
.sheet{background:#FFF;border-radius:24px;padding:22px 20px;width:100%;max-width:360px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 64px rgba(0,0,0,0.22),0 8px 24px rgba(0,0,0,0.10);position:relative;}
.sheet-title{font-size:15px;font-weight:700;color:#1C1C1E;margin-bottom:16px;padding-bottom:12px;padding-right:36px;border-bottom:0.5px solid #E5E5EA;}
.field-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid #F5F5F5;}
.field-label{font-size:12px;color:#8E8E93;font-weight:400;flex-shrink:0;}
.field-right{display:flex;justify-content:flex-end;flex:1;margin-left:12px;}
.field-input{border:none;background:transparent;font-size:13px;font-weight:500;color:#1C1C1E;outline:none;font-family:'Inter',sans-serif;text-align:right;width:100%;}
.field-input::placeholder{color:#C7C7CC;}
.field-block{padding:9px 0 4px;}
.field-textarea{width:100%;margin-top:8px;border:1px solid #E5E5EA;border-radius:12px;padding:10px 12px;font-size:14px;font-family:'Inter',sans-serif;color:#1C1C1E;outline:none;resize:none;min-height:96px;-webkit-appearance:none;}
.field-textarea:focus{border-color:#007AFF;}
.dias-sheet{font-size:13px;font-weight:700;color:#059669;}
.dias-sheet.alerta{color:#E07B00;}
.dias-sheet.vencido{color:#EF4444;}
.sheet-actions{display:flex;gap:10px;margin-top:18px;}
.sheet-btn{flex:1;padding:13px;border-radius:50px;border:none;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;}
.sheet-btn.primary{background:#007AFF;color:#FFF;}
.sheet-btn.secondary{background:#F2F2F7;color:#1C1C1E;}

.del-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9998;display:none;align-items:flex-end;justify-content:center;}
.del-overlay.active{display:flex;}
.del-modal{background:#FFF;border-radius:20px 20px 0 0;padding:24px 18px 40px;width:100%;max-width:480px;}
.del-title{font-size:15px;font-weight:700;color:#1C1C1E;margin-bottom:6px;}
.del-sub{font-size:13px;color:#8E8E93;margin-bottom:24px;}
.del-btn-danger{width:100%;padding:14px;background:#EF4444;border:none;border-radius:14px;color:#FFF;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-bottom:10px;}
.del-btn-cancel{width:100%;padding:14px;background:#F2F2F7;border:none;border-radius:14px;color:#1C1C1E;font-size:15px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;}
</style>
</head>
<body>

<div class="supercard">

  <div class="topbar">
    <button class="ios-btn-float" onclick="window.location.href='dashboard.html'">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#1C1C1E;stroke-width:2.2;fill:none"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <div class="topbar-copy">
      <div class="topbar-title">Caminhão</div>
      <div class="topbar-sub" id="status-sub">Carregando...</div>
    </div>
    <button class="ios-btn-float" onclick="abrirSheet(null)">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#1C1C1E;stroke-width:2.2;fill:none"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="lista-card">
    <div class="lista-scroll" id="lista-scroll">
      <div class="empty-state">Carregando...</div>
    </div>
    <div class="paginacao" id="paginacao" style="display:none;">
      <div class="pag-btns" id="pag-btns"></div>
    </div>
  </div>
  <div style="height:max(env(safe-area-inset-bottom),12px);flex-shrink:0;"></div>
</div>

<!-- Incluir / Alterar -->
<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet" onclick="event.stopPropagation()">
    <button onclick="fecharSheet()" style="position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:none;background:#F2F2F7;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#8E8E93;stroke-width:2.5;fill:none"><path d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="sheet-title" id="sheet-title">Nova manutenção / taxa</div>
    <div class="field-row">
      <span class="field-label">Descrição</span>
      <div class="field-right"><input class="field-input" id="sh-descricao" type="text" maxlength="100" placeholder="IPVA, troca de óleo..." autocomplete="off"/></div>
    </div>
    <div class="field-row">
      <span class="field-label">Data limite</span>
      <div class="field-right"><input class="field-input" id="sh-data" type="date" style="width:140px;" oninput="atualizarDiasSheet()"/></div>
    </div>
    <div class="field-row">
      <span class="field-label">Dias até o vencimento</span>
      <div class="field-right"><span class="dias-sheet" id="sh-dias">—</span></div>
    </div>
    <div class="field-block">
      <span class="field-label">Detalhe</span>
      <textarea class="field-textarea" id="sh-detalhe" placeholder="Algo que precise ser lembrado..."></textarea>
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn secondary" onclick="fecharSheet()">Cancelar</button>
      <button class="sheet-btn primary" id="btn-gravar" onclick="gravar()">Gravar</button>
    </div>
  </div>
</div>

<!-- Excluir -->
<div class="del-overlay" id="del-overlay">
  <div class="del-modal">
    <div class="del-title">Excluir registro?</div>
    <div class="del-sub" id="del-sub">Esta ação não pode ser desfeita.</div>
    <button class="del-btn-danger" onclick="confirmarExclusao()">Excluir definitivamente</button>
    <button class="del-btn-cancel" onclick="fecharDel()">Cancelar</button>
  </div>
</div>

<script>
const TABELA = 'ManutencaoTaxasCaminhao';
const POR_PAGINA = 15;

let _registros = [];
let _paginaAtual = 1;
let _editandoId = null;
let _idExcluir = null;
let _moveu = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hojeISO() {
  return new Date().toLocaleDateString('en-CA', {timeZone:'America/Manaus'});
}

// Dias entre hoje e a data limite (negativo = atrasado)
function diasAte(dataISO) {
  if (!dataISO) return null;
  const [a, m, d] = dataISO.split('-').map(Number);
  const [ha, hm, hd] = hojeISO().split('-').map(Number);
  return Math.round((Date.UTC(a, m - 1, d) - Date.UTC(ha, hm - 1, hd)) / 86400000);
}

function classeDias(n) {
  if (n === null) return '';
  if (n < 0) return 'vencido';
  if (n <= 7) return 'alerta';
  return '';
}

function textoDias(n) {
  if (n === null) return '—';
  if (n === 0) return 'Vence hoje';
  if (n === 1) return 'Falta 1 dia';
  if (n === -1) return 'Atrasado 1 dia';
  return n > 0 ? `Faltam ${n} dias` : `Atrasado ${-n} dias`;
}

function fmtData(iso) {
  if (!iso) return '—';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

function setStatus(msg, cor) {
  const el = document.getElementById('status-sub');
  el.textContent = msg;
  el.style.color = cor || '#8E8E93';
}

async function carregarDados() {
  const { data, error } = await window.db.from(TABELA).select('*').order('dataLimite', { ascending: true });
  if (error) { setStatus('Erro ao carregar', '#EF4444'); console.error(error); return; }
  _registros = data || [];
  const vencidos = _registros.filter(r => diasAte(r.dataLimite) < 0).length;
  setStatus(_registros.length
    ? `${_registros.length} ${_registros.length === 1 ? 'item' : 'itens'}${vencidos ? ' · ' + vencidos + ' atrasado' + (vencidos > 1 ? 's' : '') : ''}`
    : 'Sem registros', vencidos ? '#EF4444' : '#8E8E93');
  renderizarLista();
}

function renderizarLista() {
  const total = _registros.length;
  const totalPags = Math.max(1, Math.ceil(total / POR_PAGINA));
  if (_paginaAtual > totalPags) _paginaAtual = totalPags;
  const inicio = (_paginaAtual - 1) * POR_PAGINA;
  const pagina = _registros.slice(inicio, inicio + POR_PAGINA);
  const lista = document.getElementById('lista-scroll');
  const pag = document.getElementById('paginacao');

  if (!pagina.length) {
    lista.innerHTML = '<div class="empty-state">Nenhum registro. Toque em + para incluir.</div>';
    pag.style.display = 'none';
    return;
  }

  lista.innerHTML = pagina.map(r => {
    const n = diasAte(r.dataLimite);
    const cls = classeDias(n);
    return `<div class="swipe-wrap" id="swipe-${r.id}">
      <div class="swipe-actions"><div class="swipe-btn excluir" onclick="abrirDel('${r.id}')">Excluir</div></div>
      <div class="lanc-row" onclick="abrirSheet('${r.id}')">
        <div class="lanc-info">
          <span class="lanc-desc">${esc(r.descricao)}</span>
          ${r.detalhe ? `<span class="lanc-detalhe">${esc(r.detalhe)}</span>` : ''}
          <span class="lanc-data">Limite: ${fmtData(r.dataLimite)}</span>
        </div>
        <div class="dias ${cls}">
          <span class="dias-num">${n === null ? '—' : n}</span>
          <span class="dias-txt">${n === null ? '' : (Math.abs(n) === 1 ? 'dia' : 'dias')}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  pagina.forEach(r => aplicarSwipe(r.id));
  pag.style.display = 'flex';
  renderizarPaginacao(_paginaAtual, totalPags);
}

function aplicarSwipe(id) {
  const wrap = document.getElementById(`swipe-${id}`);
  if (!wrap) return;
  const row = wrap.querySelector('.lanc-row');
  let startX = 0, currentX = 0, dragging = false;
  wrap.addEventListener('touchstart', e => { startX = e.touches[0].clientX; currentX = 0; dragging = true; _moveu = false; }, {passive:true});
  wrap.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    if (Math.abs(dx) > 6) _moveu = true;
    if (dx > 0) return;
    currentX = Math.max(dx, -80);
    row.style.transform = `translateX(${currentX}px)`;
    row.style.transition = 'none';
  }, {passive:true});
  wrap.addEventListener('touchend', () => {
    dragging = false;
    row.style.transition = '';
    row.style.transform = currentX < -40 ? 'translateX(-80px)' : 'translateX(0)';
    setTimeout(() => { _moveu = false; }, 50);
  });
}

function mudarPagina(delta) {
  _paginaAtual += delta;
  renderizarLista();
  document.getElementById('lista-scroll').scrollTop = 0;
}
function irParaPagina(n) {
  _paginaAtual = n;
  renderizarLista();
  document.getElementById('lista-scroll').scrollTop = 0;
}

function renderizarPaginacao(atual, total) {
  const container = document.getElementById('pag-btns');
  let inicio = Math.max(1, atual - 2);
  let fim = Math.min(total, inicio + 4);
  if (fim - inicio < 4) inicio = Math.max(1, fim - 4);
  let html = `<button class="pag-btn-nav" onclick="mudarPagina(-1)" ${atual === 1 ? 'disabled' : ''}>
    <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg> Anterior
  </button>`;
  for (let i = inicio; i <= fim; i++) {
    html += `<button class="pag-num${i === atual ? ' ativo' : ''}" onclick="irParaPagina(${i})">${i}</button>`;
  }
  html += `<button class="pag-btn-nav" onclick="mudarPagina(1)" ${atual === total ? 'disabled' : ''}>
    Próxima <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
  </button>`;
  container.innerHTML = html;
}

// ===== Incluir / Alterar =====
function atualizarDiasSheet() {
  const el = document.getElementById('sh-dias');
  const n = diasAte(document.getElementById('sh-data').value);
  el.textContent = textoDias(n);
  el.className = 'dias-sheet ' + classeDias(n);
}

function abrirSheet(id) {
  if (_moveu) return;
  _editandoId = id;
  if (id) {
    const r = _registros.find(x => String(x.id) === String(id));
    if (!r) return;
    document.getElementById('sheet-title').textContent = 'Alterar';
    document.getElementById('sh-descricao').value = r.descricao || '';
    document.getElementById('sh-data').value = r.dataLimite || '';
    document.getElementById('sh-detalhe').value = r.detalhe || '';
  } else {
    document.getElementById('sheet-title').textContent = 'Nova manutenção / taxa';
    document.getElementById('sh-descricao').value = '';
    document.getElementById('sh-data').value = hojeISO();
    document.getElementById('sh-detalhe').value = '';
  }
  atualizarDiasSheet();
  document.getElementById('sheet-overlay').classList.add('active');
}

function fecharSheet() {
  document.getElementById('sheet-overlay').classList.remove('active');
  _editandoId = null;
}

async function gravar() {
  const descricao = document.getElementById('sh-descricao').value.trim();
  const dataLimite = document.getElementById('sh-data').value;
  const detalhe = document.getElementById('sh-detalhe').value.trim() || null;
  if (!descricao) { document.getElementById('sh-descricao').focus(); return; }
  if (!dataLimite) { document.getElementById('sh-data').focus(); return; }

  const btn = document.getElementById('btn-gravar');
  btn.disabled = true;
  const payload = { descricao, detalhe, dataLimite };
  const { error } = _editandoId
    ? await window.db.from(TABELA).update(payload).eq('id', _editandoId)
    : await window.db.from(TABELA).insert([payload]);
  btn.disabled = false;
  if (error) { setStatus('Erro ao gravar', '#EF4444'); console.error(error); return; }
  fecharSheet();
  await carregarDados();
}

// ===== Excluir =====
function abrirDel(id) {
  _idExcluir = id;
  const r = _registros.find(x => String(x.id) === String(id));
  document.getElementById('del-sub').textContent = r ? `"${r.descricao}" será removido permanentemente.` : 'Esta ação não pode ser desfeita.';
  const wrap = document.getElementById(`swipe-${id}`);
  if (wrap) wrap.querySelector('.lanc-row').style.transform = 'translateX(0)';
  document.getElementById('del-overlay').classList.add('active');
}
function fecharDel() {
  document.getElementById('del-overlay').classList.remove('active');
  _idExcluir = null;
}
async function confirmarExclusao() {
  if (!_idExcluir) return;
  const id = _idExcluir;
  fecharDel();
  const { error } = await window.db.from(TABELA).delete().eq('id', id);
  if (error) { setStatus('Erro ao excluir', '#EF4444'); console.error(error); return; }
  await carregarDados();
}

const fixHeight = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
window.addEventListener('resize', fixHeight);
document.addEventListener('DOMContentLoaded', () => { fixHeight(); carregarDados(); });
// Ao voltar para a aba (iOS), recalcula os dias
document.addEventListener('visibilitychange', () => { if (!document.hidden) carregarDados(); });
</script>
</body>
</html>
