<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>HuberHorti - Conferência de Estoque</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="utils.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F2F4F8;color:#1C1C1E;height:100vh;height:calc(var(--vh,1vh)*100);display:flex;flex-direction:column;overflow:hidden;overscroll-behavior-y:none;}
.topbar{height:56px;padding:0 18px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-copy{display:flex;flex-direction:column;align-items:center;text-align:center;flex-grow:1;}
.topbar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#1C1C1E;}
.topbar-sub{font-size:10px;color:#8E8E93;font-weight:400;margin-top:1px;}
.ios-btn{width:38px;height:38px;border-radius:50%;border:none;background:#FFF;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer;}
.card{flex:1;margin:0 16px 24px;background:#FFF;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,0.05);display:flex;flex-direction:column;min-height:0;overflow:hidden;}

.col-header{display:grid;grid-template-columns:1fr 44px 64px 72px;padding:10px 16px;border-bottom:0.5px solid #F0F0F0;flex-shrink:0;}
.col-header span{font-size:9px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:0.4px;}
.col-header span:nth-child(2){text-align:center;}
.col-header span:nth-child(3){text-align:right;}
.col-header span:nth-child(4){text-align:right;}
.lista{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
.item{display:grid;grid-template-columns:1fr 44px 64px 72px;padding:14px 16px;border-bottom:0.5px solid #F5F5F5;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}

.item:active{background:#F9F9F9;}
.item-nome{font-size:13px;color:#1C1C1E;font-weight:400;}
.item-unid{font-size:12px;color:#8E8E93;text-align:center;}
.item-sist{font-size:13px;color:#1C1C1E;text-align:right;font-weight:400;}
.item-fisico{display:flex;justify-content:flex-end;}
.item-fisico input{width:68px;text-align:right;border:none;border-bottom:1px solid #E0E0E0;background:transparent;font-family:'Inter',sans-serif;font-size:13px;color:#007AFF;outline:none;padding:2px 0;-webkit-appearance:none;}
.item-fisico input:focus{border-bottom-color:#007AFF;}
.paginacao{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;border-top:0.5px solid #F0F0F0;flex-shrink:0;}
.pag-btn{width:34px;height:34px;border-radius:50%;border:none;background:#F2F2F7;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.pag-btn:active{opacity:0.6;}
.pag-btn:disabled{opacity:0.3;pointer-events:none;}
.pag-btn svg{width:16px;height:16px;stroke:#1C1C1E;stroke-width:2.2;fill:none;}
.pag-info{font-size:12px;color:#8E8E93;font-weight:500;white-space:nowrap;}
.rodape{flex-shrink:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);border-top:0.5px solid #E5E5EA;background:#FFF;}
.rodape-resumo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rodape-label{font-size:11px;color:#8E8E93;font-weight:500;}
.rodape-val{font-size:13px;font-weight:600;color:#1C1C1E;}
.rodape-val.red{color:#EF4444;}
.rodape-val.green{color:#10B981;}
.btn-confirmar{width:100%;padding:16px;background:#C7C7CC;border:none;border-radius:100px;color:#FFF;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;cursor:pointer;letter-spacing:0.1px;transition:background 0.3s;pointer-events:none;}
.btn-confirmar:active{opacity:0.8;}
.detalhe-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:999;display:none;align-items:center;justify-content:center;}
.detalhe-overlay.active{display:flex;}
.detalhe-sheet{background:#FFF;border-radius:20px;padding:16px 18px 18px;width:calc(100% - 48px);max-width:360px;box-shadow:0 32px 64px rgba(0,0,0,0.22),0 8px 24px rgba(0,0,0,0.10);animation:floatIn 0.2s cubic-bezier(0.4,0,0.2,1);}
@keyframes floatIn{from{opacity:0;transform:scale(0.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.detalhe-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:0.5px solid #F0F0F0;}
.detalhe-title{font-size:13px;font-weight:600;color:#1C1C1E;}
.detalhe-close{width:26px;height:26px;border-radius:50%;border:none;background:#F2F2F7;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.detalhe-close svg{width:12px;height:12px;stroke:#1C1C1E;stroke-width:2.5;fill:none;}
.detalhe-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid #F5F5F5;}
.detalhe-row:last-child{border-bottom:none;}
.detalhe-label{font-size:12px;color:#8E8E93;font-weight:400;}
.detalhe-val{font-size:13px;font-weight:500;color:#1C1C1E;}
.detalhe-val.red{color:#EF4444;}
.detalhe-val.green{color:#10B981;}
.detalhe-input{width:90px;text-align:right;border:none;border-bottom:1px solid #E0E0E0;background:transparent;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:#007AFF;outline:none;padding:2px 0;-webkit-appearance:none;}
.detalhe-input:focus{border-bottom-color:#007AFF;}

.detalhe-link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding:10px;background:#F0F6FF;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;}
.detalhe-link span{font-size:13px;color:#007AFF;font-weight:500;}
.detalhe-link svg{width:14px;height:14px;stroke:#007AFF;stroke-width:2;fill:none;}
.btn-relatorio{width:100%;margin-top:8px;padding:13px;background:#F0F6FF;border:none;border-radius:100px;color:#007AFF;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-relatorio:active{opacity:0.7;}
.rel-texto{width:100%;height:46vh;max-height:340px;border:none;background:#F7F7F9;border-radius:12px;padding:12px;font-family:'Inter',sans-serif;font-size:13px;line-height:1.5;color:#1C1C1E;overflow-y:auto;white-space:pre-wrap;user-select:text;-webkit-user-select:text;}
.rel-acoes{display:flex;gap:8px;margin-top:12px;}
.rel-btn{flex:1;padding:12px;border:none;border-radius:12px;background:#007AFF;color:#FFF;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.rel-btn.sec{background:#F2F2F7;color:#1C1C1E;}
.empty{font-size:13px;color:#C7C7CC;text-align:center;padding:32px 0;}
.loading{font-size:13px;color:#C7C7CC;text-align:center;padding:32px 0;}
.item-acumulado{grid-column:1 / -1;font-size:11px;color:#EF4444;font-weight:500;padding-top:2px;text-align:right;}

</style>
</head>
<body>

<div class="topbar">
  <button class="ios-btn" onclick="voltarParaOrigem()">
    <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#1C1C1E;stroke-width:2.2;fill:none"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
  </button>
  <div class="topbar-copy">
    <div class="topbar-title">Conferência de Estoque</div>
    <div class="topbar-sub" id="topbar-ciclo"></div>
  </div>
  <div style="width:38px;"></div>
</div>

<div class="card">
  <div class="col-header">
    <span>Produto</span>
    <span>Unid</span>
    <span>Sist.</span>
    <span>Físico</span>
  </div>
  <div class="lista" id="lista">
    <div class="loading">Carregando...</div>
  </div>
  <div class="paginacao" id="paginacao" style="display:none;">
    <button class="pag-btn" id="pag-prev" onclick="mudarPagina(-1)">
      <svg viewBox="0 0 24 24"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <span class="pag-info" id="pag-info"></span>
    <button class="pag-btn" id="pag-next" onclick="mudarPagina(1)">
      <svg viewBox="0 0 24 24"><path d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
    </button>
  </div>
  <div class="rodape">
    <div class="rodape-resumo">
      <span class="rodape-label">Diferença total</span>
      <span class="rodape-val" id="rodape-dif">0,00</span>
    </div>
    <button class="btn-confirmar" id="btn-confirmar" onclick="confirmarConferencia()">Confirmar Conferência</button>
    <button class="btn-relatorio" onclick="abrirRelatorio()">Relatório do Físico (Sobras)</button>
  </div>
</div>

<div class="detalhe-overlay" id="detalhe-overlay" onclick="fecharDetalhe()">
  <div class="detalhe-sheet" onclick="event.stopPropagation()">
    <div class="detalhe-header">
      <span class="detalhe-title" id="detalhe-title"></span>
      <button class="detalhe-close" onclick="fecharDetalhe()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="detalhe-row"><span class="detalhe-label">Est. Inicial</span><input class="detalhe-input" id="d-inicial" type="text" inputmode="decimal" oninput="mascaraInput(this);recalcularDetalhe();"></div>

    <div class="detalhe-row"><span class="detalhe-label">Entradas</span><span class="detalhe-val green" id="d-entradas"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Saídas</span><span class="detalhe-val red" id="d-saidas"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Sistema</span><span class="detalhe-val" id="d-sist"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Físico</span><span class="detalhe-val" id="d-fisico"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Diferença</span><span class="detalhe-val" id="d-dif"></span></div>
    <a class="detalhe-link" id="detalhe-link-vendas" onclick="irParaVendas()">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Ver vendas do produto</span>
    </a>
  </div>
</div>

<div class="detalhe-overlay" id="rel-overlay" onclick="fecharRelatorio()">
  <div class="detalhe-sheet" onclick="event.stopPropagation()">
    <div class="detalhe-header">
      <span class="detalhe-title">Relatório</span>
      <button class="detalhe-close" onclick="fecharRelatorio()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="rel-texto" id="rel-texto"></div>
    <div class="rel-acoes">
      <button class="rel-btn sec" id="rel-copiar" onclick="copiarRelatorio()">Copiar</button>
      <button class="rel-btn" onclick="compartilharRelatorio()">Compartilhar PDF</button>
    </div>
  </div>
</div>

<script>
window.HHUtils.atualizarCicloAtualGlobal();
const fixHeight = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
window.addEventListener('resize', fixHeight); fixHeight();

function voltarParaOrigem() { window.location.href = 'dashboard.html'; }

function fmtNum(v) {
  return Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function parseNum(str) {
  if (!str) return 0;
  return parseFloat(String(str).replace(/\./g,'').replace(',','.')) || 0;
}
function mascaraInput(el) {
  let digits = el.value.replace(/\D/g,'');
  if (!digits) { el.value = ''; return; }
  let num = parseInt(digits, 10) / 100;
  el.value = fmtNum(num);
}

let _itens = [];
let _pagina = 0;
const POR_PAGINA = 15;
let _produtoDetalheNome = '';
let _detalheIdx = -1;

function recalcularDetalhe() {
  if (_detalheIdx === -1) return;
  const i = _itens[_detalheIdx];
  const novoIni = parseNum(document.getElementById('d-inicial').value);
  const novoSist = novoIni + i.entradas - i.saidas;
  const fisicoBruto = document.getElementById('d-fisico').textContent;
  const fisico = parseNum(fisicoBruto);
  const dif = fisico - novoSist;

  i.estIni = novoIni;
  i.sist = novoSist;
  i.fisico = fisico;

  document.getElementById('d-sist').textContent = fmtNum(novoSist);
  const dEl = document.getElementById('d-dif');
  dEl.textContent = (dif >= 0 ? '+' : '') + fmtNum(dif);
  dEl.className = 'detalhe-val' + (dif < 0 ? ' red' : dif > 0 ? ' green' : '');

  const sistEl = document.getElementById(`sist-${_detalheIdx}`);
  if (sistEl) sistEl.textContent = fmtNum(novoSist);
  const fisicoEl = document.getElementById(`fisico-${_detalheIdx}`);
  if (fisicoEl) fisicoEl.value = fmtNum(fisico);

  atualizarRodape();
  setBtnEstado('pendente');
  salvarEstado();
}




function setBtnEstado(estado) {
  const btn = document.getElementById('btn-confirmar');
  if (estado === 'pendente') {
    btn.textContent = 'Confirmar Conferência';
    btn.style.background = '#4A90D9';
    btn.style.pointerEvents = 'all';
    btn.style.cursor = 'pointer';
  } else if (estado === 'salvando') {
    btn.textContent = 'Salvando...';
    btn.style.background = '#C7C7CC';
    btn.style.pointerEvents = 'none';
    btn.style.cursor = 'default';
  } else if (estado === 'salvo') {
    btn.textContent = 'Conferência Realizada ✓';
    btn.style.background = '#10B981';
    btn.style.pointerEvents = 'none';
    btn.style.cursor = 'default';
  } else {
    // inativo
    btn.textContent = 'Confirmar Conferência';
    btn.style.background = '#C7C7CC';
    btn.style.pointerEvents = 'none';
    btn.style.cursor = 'default';
  }
}

const CHAVE_RASCUNHO = 'conf_estoque_rascunho';
let _cicloChave = '';

// Grava no localStorage apenas o que foi digitado (Físico) e o Est. Inicial alterado
function salvarEstado() {
  try {
    const fisicos = {}, iniciais = {};
    _itens.forEach(item => {
      if (item.fisicoDigitado) fisicos[item.produto_id] = fmtNum(item.fisico);
      if (item.estIni !== item.estIniOrig) iniciais[item.produto_id] = fmtNum(item.estIni);
    });
    localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify({ ciclo: _cicloChave, fisicos, iniciais, pagina: _pagina }));
  } catch (e) { console.warn('Não foi possível salvar rascunho', e); }
}

function limparRascunho() {
  try { localStorage.removeItem(CHAVE_RASCUNHO); } catch (e) {}
}

function restaurarEstado() {
  let r = null;
  try { r = JSON.parse(localStorage.getItem(CHAVE_RASCUNHO) || 'null'); } catch (e) {}
  if (!r || r.ciclo !== _cicloChave) return;
  const iniciais = r.iniciais || {}, fisicos = r.fisicos || {};
  _itens.forEach(item => {
    if (iniciais[item.produto_id] !== undefined) {
      item.estIni = parseNum(iniciais[item.produto_id]);
      item.sist = item.estIni + item.entradas - item.saidas;
    }
    if (fisicos[item.produto_id] !== undefined) {
      item.fisico = parseNum(fisicos[item.produto_id]);
      item.fisicoDigitado = true;
    } else {
      item.fisico = item.sist;
    }
  });
  const totalPags = Math.max(1, Math.ceil(_itens.length / POR_PAGINA));
  _pagina = Math.min(Math.max(parseInt(r.pagina) || 0, 0), totalPags - 1);
}


function irParaVendas() {
  salvarEstado();
  window.location.href = `pesquisa_vendas_por_produtos.html?produto_nome=${encodeURIComponent(_produtoDetalheNome)}`;
}

function atualizarRodape() {
  let dif = 0;
  _itens.forEach((item) => {
    dif += (item.fisico - item.sist) * item.custoUni;
  });

  const el = document.getElementById('rodape-dif');
  el.textContent = fmtNum(dif);
  el.className = 'rodape-val' + (dif < 0 ? ' red' : dif > 0 ? ' green' : '');
}

function renderLista() {
  const lista = document.getElementById('lista');
  if (_itens.length === 0) {
    lista.innerHTML = '<div class="empty">Nenhum produto encontrado no ciclo</div>';
    document.getElementById('paginacao').style.display = 'none';
    setBtnEstado('inativo');
    return;
  }
  const totalPags = Math.ceil(_itens.length / POR_PAGINA);
  const inicio = _pagina * POR_PAGINA;
  const fim = Math.min(inicio + POR_PAGINA, _itens.length);
  const itensPag = _itens.slice(inicio, fim);

  // Acumulado global até o início da página atual
  let acumuladoGlobal = 0;
  _itens.slice(0, inicio).forEach(item => {
    acumuladoGlobal += (item.fisico - item.sist) * item.custoUni;
  });

  let acumuladoPagina = acumuladoGlobal;
  lista.innerHTML = itensPag.map((item) => {
    const idx = _itens.indexOf(item);
    const dif = item.fisico - item.sist;
    const temFalta = dif !== 0;

    const valorItem = dif * item.custoUni;
    acumuladoPagina += valorItem;

    const sinalValor = valorItem >= 0 ? '+' : '-';
const sinalAcum = acumuladoPagina >= 0 ? '+' : '-';
const corValor = valorItem >= 0 ? '#10B981' : '#EF4444';
const corAcum = acumuladoPagina >= 0 ? '#10B981' : '#EF4444';
const acumuladoHtml = temFalta
  ? `<span class="item-acumulado">${fmtNum(dif)} ${item.unid_venda || ''}&nbsp;&nbsp;•&nbsp;&nbsp;<span style="color:${corValor}">${sinalValor}R$ ${fmtNum(Math.abs(valorItem))}</span>&nbsp;&nbsp;•&nbsp;&nbsp;<span style="color:${corAcum}">${sinalAcum}R$ ${fmtNum(Math.abs(acumuladoPagina))}</span></span>`
  : '';


    return `<div class="item" onclick="abrirDetalhe(${idx})" style="${temFalta ? 'grid-template-rows:auto auto;align-items:start;' : ''}">
      <span class="item-nome" id="nome-${idx}" style="${temFalta ? 'display:flex;flex-direction:column;gap:2px;' : ''}">${item.nome}${temFalta ? acumuladoHtml : ''}</span>

      <span class="item-unid">${item.unid_venda || '—'}</span>
      <span class="item-sist" id="sist-${idx}">${fmtNum(item.sist)}</span>
      <div class="item-fisico">
        <input
          type="text"
          inputmode="decimal"
          id="fisico-${idx}"
          value="${fmtNum(item.fisico)}"
          onclick="event.stopPropagation();setTimeout(()=>this.select(),50);"
          onfocus="setTimeout(()=>this.select(),50);"
          oninput="mascaraInput(this);atualizarFisico(${idx},this.value);"
        >
      </div>
    </div>`;

  }).join('');


    lista.scrollTop = 0;
  const temAlteracao = _itens.some(item => item.fisico !== item.sist);
  setBtnEstado(temAlteracao ? 'pendente' : 'inativo');


  const pagEl = document.getElementById('paginacao');
  if (totalPags > 1) {
    pagEl.style.display = 'flex';
    document.getElementById('pag-info').textContent = `${_pagina + 1} de ${totalPags}`;
    document.getElementById('pag-prev').disabled = _pagina === 0;
    document.getElementById('pag-next').disabled = _pagina >= totalPags - 1;
  } else {
    pagEl.style.display = 'none';
  }
}

function mudarPagina(dir) {
  const totalPags = Math.ceil(_itens.length / POR_PAGINA);
  _pagina = Math.max(0, Math.min(_pagina + dir, totalPags - 1));
  salvarEstado();
  renderLista();
}

function atualizarFisico(idx, valor) {
  const parsed = parseNum(valor);
  const vazio = isNaN(parsed) || valor === '';
  _itens[idx].fisico = vazio ? _itens[idx].sist : parsed;
  _itens[idx].fisicoDigitado = !vazio;
  salvarEstado();

  atualizarRodape();
  atualizarLinhaAcumulado();
  setBtnEstado('pendente');
}

function atualizarLinhaAcumulado() {
  const inicio = _pagina * POR_PAGINA;
  const fim = Math.min(inicio + POR_PAGINA, _itens.length);
  const itensPag = _itens.slice(inicio, fim);

  // Acumulado global até o início da página atual
  let acumuladoGlobalLinha = 0;
  _itens.slice(0, inicio).forEach(item => {
    acumuladoGlobalLinha += (item.fisico - item.sist) * item.custoUni;
  });

  let acumuladoPagina = acumuladoGlobalLinha;
  itensPag.forEach((item) => {
    const idx = _itens.indexOf(item);
    const dif = item.fisico - item.sist;
    const temFalta = dif !== 0;
    const valorItem = dif * item.custoUni;
    acumuladoPagina += valorItem;

    const nomeEl = document.getElementById(`nome-${idx}`);
    if (!nomeEl) return;

    let acumuladoEl = nomeEl.querySelector('.item-acumulado');
        if (temFalta) {
      const sinalValor = valorItem >= 0 ? '+' : '-';
      const sinalAcum = acumuladoPagina >= 0 ? '+' : '-';
      const corValor = valorItem >= 0 ? '#10B981' : '#EF4444';
      const corAcum = acumuladoPagina >= 0 ? '#10B981' : '#EF4444';
      const texto = `${fmtNum(dif)} ${item.unid_venda || ''}&nbsp;&nbsp;•&nbsp;&nbsp;<span style="color:${corValor}">${sinalValor}R$ ${fmtNum(Math.abs(valorItem))}</span>&nbsp;&nbsp;•&nbsp;&nbsp;<span style="color:${corAcum}">${sinalAcum}R$ ${fmtNum(Math.abs(acumuladoPagina))}</span>`;
      if (!acumuladoEl) {
        acumuladoEl = document.createElement('span');
        acumuladoEl.className = 'item-acumulado';
        nomeEl.style.display = 'flex';
        nomeEl.style.flexDirection = 'column';
        nomeEl.style.gap = '2px';
        nomeEl.appendChild(acumuladoEl);
      }
      acumuladoEl.innerHTML = texto;

    } else {
      if (acumuladoEl) acumuladoEl.remove();
      nomeEl.style.display = '';
      nomeEl.style.flexDirection = '';
      nomeEl.style.gap = '';
    }
  });
}

// ---------- Relatório do Físico (Sobras) ----------
function normUnid(u) { return String(u || '').trim().toLowerCase().replace(/\./g, ''); }

// Converte o físico (na unid_venda, normalmente kg) para "N Sc, X kg"
function formatarFisico(item) {
  const fisico = Math.round(item.fisico * 100) / 100;
  const uv = normUnid(item.unid_venda);
  const uc = normUnid(item.unid_compra);
  const peso = item.peso_por_unid;
  const nomeCompra = (item.unid_compra || '').trim();
  const nomeVenda = (item.unid_venda || '').trim();

  // Físico em kg e produto comprado em outra embalagem (Sc, Cx...) com peso conhecido
  if (uv === 'kg' && uc && uc !== 'kg' && peso > 0) {
    const embal = Math.floor(Math.round((fisico / peso) * 100) / 100 + 1e-9);
    const resto = Math.round((fisico - embal * peso) * 100) / 100;
    const partes = [];
    if (embal > 0) partes.push(`${embal} ${nomeCompra}`);
    if (resto > 0 || embal === 0) partes.push(`${fmtQtd(resto)} kg`);
    return partes;
  }
  // Sem conversão possível: mostra na própria unidade do físico
  return [`${fmtQtd(fisico)}${nomeVenda ? ' ' + nomeVenda : ''}`];
}

function fmtQtd(v) {
  return Number(v).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:2});
}

function gerarTextoRelatorio() {
  const hoje = new Date().toLocaleDateString('pt-BR', {timeZone:'America/Manaus'});
  const linhas = _itens
    .filter(i => Math.round(i.fisico * 100) > 0)
    .map(i => {
      const [a, b] = formatarFisico(i);
      return b ? `${a} ${i.nome}, ${b}` : `${a} ${i.nome}`;
    });
  return `*Estoque Físico (Sobras)*\nEm: ${hoje}\n\n` + (linhas.length ? linhas.join('\n') : 'Nenhuma sobra.');
}

let _relTexto = '';
function abrirRelatorio() {
  _relTexto = gerarTextoRelatorio();
  const el = document.getElementById('rel-texto');
  el.textContent = '';
  _relTexto.split('\n').forEach((l, k) => {
    if (k) el.appendChild(document.createTextNode('\n'));
    if (k === 0) { const b = document.createElement('b'); b.textContent = l.replace(/\*/g, ''); el.appendChild(b); }
    else el.appendChild(document.createTextNode(l));
  });
  document.getElementById('rel-copiar').textContent = 'Copiar';
  document.getElementById('rel-overlay').classList.add('active');
}
function fecharRelatorio() { document.getElementById('rel-overlay').classList.remove('active'); }

async function copiarRelatorio() {
  try { await navigator.clipboard.writeText(_relTexto); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = _relTexto;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  document.getElementById('rel-copiar').textContent = 'Copiado ✓';
}
// PDF de texto simples gerado direto no navegador (sem biblioteca externa)
function gerarPdfRelatorio() {
  const linhas = _relTexto.split('\n').map(l => l.replace(/\*/g, ''));
  const W = 595, H = 842, M = 51, LH = 22, MAX = 62;
  const esc = t => t.replace(/[^\x20-\xFF]/g, '?').replace(/([\\()])/g, '\\$1');
  const quebrar = t => {
    const out = []; let cur = '';
    t.split(' ').forEach(w => {
      if ((cur + ' ' + w).trim().length > MAX && cur) { out.push(cur); cur = w; }
      else cur = (cur ? cur + ' ' : '') + w;
    });
    if (cur) out.push(cur);
    return out;
  };

  const corpo = [];
  linhas.slice(2).forEach(l => { if (l.trim()) quebrar(l).forEach(p => corpo.push(p)); });

  const paginas = [];
  let y = H - M - 18, cs = '';
  cs += `BT /F2 18 Tf 0.11 0.11 0.12 rg ${M} ${y} Td (${esc(linhas[0])}) Tj ET\n`; y -= 22;
  cs += `BT /F1 11 Tf 0.43 0.43 0.45 rg ${M} ${y} Td (${esc(linhas[1])}) Tj ET\n`; y -= 12;
  cs += `0.86 0.86 0.88 RG 0.8 w ${M} ${y} m ${W - M} ${y} l S\n`; y -= 26;
  corpo.forEach(t => {
    if (y < M) { paginas.push(cs); cs = ''; y = H - M - 18; }
    cs += `BT /F1 13 Tf 0.11 0.11 0.12 rg ${M} ${y} Td (${esc(t)}) Tj ET\n`; y -= LH;
  });
  paginas.push(cs);

  // objetos: 1 catálogo, 2 páginas, 3 fonte normal, 4 fonte negrito, depois (página, conteúdo) por página
  const objs = [];
  const kids = paginas.map((_, i) => `${5 + i * 2} 0 R`).join(' ');
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[2] = `<< /Type /Pages /Kids [${kids}] /Count ${paginas.length} >>`;
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  paginas.forEach((c, i) => {
    objs[5 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`;
    objs[6 + i * 2] = `<< /Length ${c.length} >>\nstream\n${c}endstream`;
  });

  let pdf = '%PDF-1.4\n';
  const offs = [];
  for (let n = 1; n < objs.length; n++) { offs[n] = pdf.length; pdf += `${n} 0 obj\n${objs[n]}\nendobj\n`; }
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let n = 1; n < objs.length; n++) pdf += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  pdf += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;

  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
  return new Blob([bytes], { type: 'application/pdf' });
}

async function compartilharRelatorio() {
  try {
    const dataISO = new Date().toLocaleDateString('en-CA', {timeZone:'America/Manaus'});
    const nome = `Estoque_Fisico_${dataISO}.pdf`;
    const blob = gerarPdfRelatorio();
    const arquivo = new File([blob], nome, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      await navigator.share({ files: [arquivo], title: 'Estoque Físico (Sobras)' });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // fechou o menu de compartilhar
    console.error(e);
    alert('Erro ao gerar PDF: ' + e.message);
  }
}

async function confirmarConferencia() {
  console.log("Iniciando Fechamento de Estoque...");
  setBtnEstado('salvando');

  try {
    // 1. LIMPEZA: Remove tudo do estoque inicial para garantir que não sobre "lixo"
    const { error: errDelete } = await window.db
      .from('estoque_inicial')
      .delete()
      .neq('produto_id', '00000000-0000-0000-0000-000000000000'); 

    if (errDelete) throw errDelete;

    // 2. FILTRAGEM: Pega apenas os produtos que você contou como maior que zero
    const dadosParaInserir = _itens
      .filter(item => item.fisico > 0)
      .map(item => ({
        produto_id: item.produto_id,
        quantidade_inicial: item.fisico,
        custo_unitario_inicial: item.custoUni || 0
      }));

    // 3. GRAVAÇÃO DOS ITENS: Insere a nova contagem física
    if (dadosParaInserir.length > 0) {
      const { error: errInsert } = await window.db
        .from('estoque_inicial')
        .insert(dadosParaInserir);

      if (errInsert) throw errInsert;
    }

    // 4. CONSOLIDAÇÃO: Atualiza o resumo financeiro com o nome sugerido
    const difTotal = _itens.reduce((acc, item) => acc + (item.fisico - item.sist) * item.custoUni, 0);
    
    const { error: errConsolidacao } = await window.db
      .from('consolidacao')
      .upsert({ 
        id: 1, 
        operacao: 'Fechamento Estoque', // Nome sugestivo atualizado
        valor1: difTotal,               // Diferença total
        valor2: 0,                      // v2 zerado (reservado para outros fechamentos)
        data: new Date().toISOString() 
      }, { onConflict: 'id' });

    if (errConsolidacao) throw errConsolidacao;

    console.log("Processo concluído com sucesso!");
    limparRascunho();
    setBtnEstado('salvo');
    alert('Sucesso! Estoque inicial atualizado e Fechamento de Estoque registrado.');

  } catch (err) {
    console.error("Erro no processo:", err);
    alert('Erro ao processar fechamento: ' + err.message);
    setBtnEstado('pendente');
  }
}



async function carregarDados() {
  const { d0, d7 } = window.cicloAtual;
    const d0Str = d0.toLocaleDateString('en-CA', {timeZone:'America/Manaus'});
  const d7Str = d7.toLocaleDateString('en-CA', {timeZone:'America/Manaus'});
  const d7ISO = new Date(new Date(`${d0Str}T00:00:00+00:00`).getTime() + 7 * 86400000).toISOString();


  document.getElementById('topbar-ciclo').textContent =
    `${window.HHUtils.formatarDataBR(d0)} — ${window.HHUtils.formatarDataBR(d7)}`;

  const { data: produtos } = await window.db.from('produtos').select('id, nome, unid_venda, unid_compra, peso_por_unid, preco_medio_compra').order('nome');
  const { data: estoqueIni } = await window.db.from('estoque_inicial').select('produto_id, quantidade_inicial');

  const { data: pedidosCompra } = await window.db.from('pedidos_compras')
    .select('id').gte('data', d0Str).lte('data', d7Str);
  const idsCompra = (pedidosCompra || []).map(p => p.id);
  let compras = [];
  if (idsCompra.length > 0) {
    const { data: itensCompra } = await window.db.from('itens_pedidos_compras')
      .select('produto_id, quantidade').in('pedido_compra_id', idsCompra);
    compras = itensCompra || [];
  }

  const { data: pedidosVenda } = await window.db.from('pedidos_vendas')
    .select('id').gte('data', d0Str).lt('data', d7ISO);

  const idsVenda = (pedidosVenda || []).map(p => p.id);
  let vendas = [];
  if (idsVenda.length > 0) {
    const { data: itensVenda } = await window.db.from('itens_pedidos_vendas')
      .select('produto_id, quantidade').in('pedido_venda_id', idsVenda);
    vendas = itensVenda || [];
  }

  const produtosEnvolvidos = new Set();
  (estoqueIni || []).forEach(e => produtosEnvolvidos.add(e.produto_id));
  compras.forEach(c => produtosEnvolvidos.add(c.produto_id));
  vendas.forEach(v => produtosEnvolvidos.add(v.produto_id));

  _itens = [];
  produtosEnvolvidos.forEach(prodId => {
    const prod = (produtos || []).find(p => p.id === prodId);
    if (!prod) return;
    const estIniRec = (estoqueIni || []).find(e => e.produto_id === prodId);
    const estIni = estIniRec ? parseFloat(estIniRec.quantidade_inicial) || 0 : 0;
    const entradas = compras.filter(c => c.produto_id === prodId).reduce((a,c) => a + (parseFloat(c.quantidade)||0), 0);
    const saidas = vendas.filter(v => v.produto_id === prodId).reduce((a,v) => a + (parseFloat(v.quantidade)||0), 0);
    const sist = estIni + entradas - saidas;
    _itens.push({ produto_id: prodId, nome: prod.nome, unid_venda: prod.unid_venda || '', unid_compra: prod.unid_compra || '', peso_por_unid: parseFloat(prod.peso_por_unid) || 0, estIni, estIniOrig: estIni, entradas, saidas, sist, fisico: sist, fisicoDigitado: false, custoUni: parseFloat(prod.preco_medio_compra) || 0 });
  });

  _itens.sort((a, b) => a.nome.localeCompare(b.nome));
  _pagina = 0;
  _cicloChave = d0Str;
  restaurarEstado();
  renderLista();
  atualizarRodape();
}

carregarDados();
