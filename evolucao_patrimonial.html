<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>HuberHorti - Evolução Patrimonial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="utils.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#F2F4F8;
  --card:#FFFFFF;
  --text:#1C1C1E;
  --muted:#8E8E93;
  --border:rgba(0,0,0,0.06);
  --border2:#E5E5EA;
  --grid:rgba(0,0,0,0.06);
  --axis-text:#8E8E93;
  --wick:#B0B0B6;
  --corpo-lucro:#FFFFFF;
  --corpo-lucro-borda:#1C1C1E;
  --corpo-prejuizo:#1C1C1E;
  --corpo-prejuizo-borda:#1C1C1E;
  --legenda-lucro:#1C1C1E;
  --legenda-prejuizo:#1C1C1E;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --card:#1C1C1E;
    --text:#F2F2F7;
    --muted:#98989F;
    --border:rgba(255,255,255,0.08);
    --border2:rgba(255,255,255,0.10);
    --grid:rgba(255,255,255,0.07);
    --axis-text:#8E8E93;
    --wick:#5A5A60;
    --corpo-lucro:#22C55E;
    --corpo-lucro-borda:#22C55E;
    --corpo-prejuizo:#F87171;
    --corpo-prejuizo-borda:#F87171;
    --legenda-lucro:#22C55E;
    --legenda-prejuizo:#F87171;
  }
}

body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;height:calc(var(--vh,1vh)*100);display:flex;flex-direction:column;overflow:hidden;overscroll-behavior-y:none;}

.topbar{height:56px;padding:0 18px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-copy{display:flex;flex-direction:column;align-items:center;text-align:center;flex-grow:1;}
.topbar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text);}
.topbar-sub{font-size:10px;color:var(--muted);font-weight:400;margin-top:1px;}
.ios-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer;}

.card-wrap{flex:1;margin:12px 16px 12px;background:var(--card);border-radius:20px;border:0.5px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.legenda{display:flex;gap:14px;align-items:center;padding:10px 14px;border-bottom:0.5px solid var(--border2);flex-shrink:0;}
.legenda-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);}
.legenda-dot{width:8px;height:8px;border-radius:2px;border:1px solid var(--border2);}

.chart-scroll{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;min-height:0;position:relative;}
.chart-inner{height:100%;position:relative;}
canvas#candle-canvas{display:block;height:100%;touch-action:pan-x;}

.empty-state,.loading{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);text-align:center;padding:20px;}

.detalhe-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:999;display:none;align-items:flex-end;justify-content:center;}
.detalhe-overlay.active{display:flex;}
.detalhe-sheet{background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);width:100%;max-width:480px;}
.detalhe-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid var(--border2);}
.detalhe-title{font-size:14px;font-weight:700;color:var(--text);}
.detalhe-close{width:26px;height:26px;border-radius:50%;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.detalhe-close svg{width:12px;height:12px;stroke:var(--text);stroke-width:2.5;fill:none;}
.detalhe-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border2);}
.detalhe-row:last-child{border-bottom:none;}
.detalhe-label{font-size:12px;color:var(--muted);}
.detalhe-val{font-size:13px;font-weight:600;color:var(--text);}
.detalhe-val.lucro{color:var(--legenda-lucro);}
.detalhe-val.prejuizo{color:var(--legenda-prejuizo);}
</style>
</head>
<body>

<div class="topbar">
  <button class="ios-btn" onclick="window.location.href='dashboard.html'">
    <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--text);stroke-width:2.2;fill:none"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
  </button>
  <div class="topbar-copy">
    <div class="topbar-title">Evolução Patrimonial</div>
    <div class="topbar-sub" id="topbar-sub">Carregando...</div>
  </div>
  <div style="width:38px;"></div>
</div>

<div class="card-wrap">
  <div class="legenda">
    <div class="legenda-item"><span class="legenda-dot" style="background:var(--corpo-lucro);"></span>Lucro</div>
    <div class="legenda-item"><span class="legenda-dot" style="background:var(--corpo-prejuizo);"></span>Prejuízo</div>
    <div class="legenda-item" style="margin-left:auto;">Toque num candle pra detalhes</div>
  </div>
  <div class="chart-scroll" id="chart-scroll">
    <div class="loading" id="loading-msg">Carregando dados...</div>
  </div>
</div>

<div class="detalhe-overlay" id="detalhe-overlay" onclick="fecharDetalhe()">
  <div class="detalhe-sheet" onclick="event.stopPropagation()">
    <div class="detalhe-header">
      <span class="detalhe-title" id="detalhe-title"></span>
      <button class="detalhe-close" onclick="fecharDetalhe()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="detalhe-row"><span class="detalhe-label">Vendas Brutas</span><span class="detalhe-val" id="d-vendas"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Lucro Bruto</span><span class="detalhe-val" id="d-bruto"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Despesas</span><span class="detalhe-val" id="d-despesas"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Lucro Líquido</span><span class="detalhe-val" id="d-liquido"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Líquido / Vendas</span><span class="detalhe-val" id="d-liquido-pct"></span></div>
  </div>
</div>

<script>
const fmt = v => Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtPct = v => (v === null || v === undefined || !isFinite(v)) ? '—' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';

const fixHeight = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
window.addEventListener('resize', fixHeight); fixHeight();

// ── Paleta conforme claro/escuro, lida do CSS pra usar no canvas ──
function paleta() {
  const cs = getComputedStyle(document.documentElement);
  return {
    grid: cs.getPropertyValue('--grid').trim(),
    axisText: cs.getPropertyValue('--axis-text').trim(),
    text: cs.getPropertyValue('--text').trim(),
    wick: cs.getPropertyValue('--wick').trim(),
    corpoLucro: cs.getPropertyValue('--corpo-lucro').trim(),
    corpoLucroBorda: cs.getPropertyValue('--corpo-lucro-borda').trim(),
    corpoPrejuizo: cs.getPropertyValue('--corpo-prejuizo').trim(),
    corpoPrejuizoBorda: cs.getPropertyValue('--corpo-prejuizo-borda').trim()
  };
}

// ── Busca paginada (contorna o limite de 1000 linhas do Supabase) ──
async function fetchTodasLinhas(tabela, colunas, aplicarFiltros) {
  const TAMANHO_PAGINA = 1000;
  let todos = [];
  let pagina = 0;
  while (true) {
    let q = db.from(tabela).select(colunas);
    q = aplicarFiltros(q);
    q = q.range(pagina * TAMANHO_PAGINA, pagina * TAMANHO_PAGINA + TAMANHO_PAGINA - 1);
    const { data, error } = await q;
    if (error) throw error;
    if (!data || data.length === 0) break;
    todos = todos.concat(data);
    if (data.length < TAMANHO_PAGINA) break;
    pagina++;
  }
  return todos;
}

// ── Ciclo semanal: quarta 00:00 até a terça seguinte, igual ao resto do sistema ──
function d0DoCiclo(date) {
  const diaSemana = date.getDay(); // 0=Dom ... 3=Qua
  const diasDesdeQuarta = (diaSemana - 3 + 7) % 7;
  const d0 = new Date(date);
  d0.setHours(0,0,0,0);
  d0.setDate(d0.getDate() - diasDesdeQuarta);
  return d0;
}
function chaveCiclo(date) {
  return d0DoCiclo(date).toISOString().slice(0,10);
}

let _candles = [];        // todos os ciclos com atividade (mantém a cadeia acumulada certa)
let _candlesVisiveis = []; // só os que entram no desenho (tem venda e não passam do ciclo atual)

async function carregarDados() {
  const { data: contas } = await db.from('contas_contabeis').select('id, is_despesa');
  const despesaIds = new Set((contas || []).filter(c => c.is_despesa).map(c => c.id));

  const [vendas, compras, lancamentos] = await Promise.all([
    fetchTodasLinhas('pedidos_vendas', 'data, total_venda, total_lucro', q => q.not('data','is',null)),
    fetchTodasLinhas('pedidos_compras', 'data, itens_pedidos_compras(ganho)', q => q.not('data','is',null)),
    fetchTodasLinhas('livro_caixa', 'data, valor, tipo, conta_id', q => q.not('data','is',null))
  ]);

  const mapa = {}; // chave -> {vendasBrutas, bruto, despesas}
  function garantir(chave) {
    if (!mapa[chave]) mapa[chave] = { vendasBrutas: 0, bruto: 0, despesas: 0 };
    return mapa[chave];
  }

  vendas.forEach(v => {
    if (!v.data) return;
    const g = garantir(chaveCiclo(new Date(v.data)));
    g.vendasBrutas += parseFloat(v.total_venda) || 0;
    g.bruto += parseFloat(v.total_lucro) || 0;
  });

  compras.forEach(p => {
    if (!p.data) return;
    const ganho = (p.itens_pedidos_compras || []).reduce((a, i) => a + (parseFloat(i.ganho) || 0), 0);
    garantir(chaveCiclo(new Date(p.data))).bruto += ganho;
  });

  lancamentos.forEach(l => {
    if (!l.data) return;
    const isDespesa = l.tipo === 'saida' && l.conta_id && despesaIds.has(l.conta_id);
    if (!isDespesa) return;
    garantir(chaveCiclo(new Date(l.data))).despesas += parseFloat(l.valor) || 0;
  });

  const chaves = Object.keys(mapa).sort();
  let acumulado = 0;
  _candles = chaves.map(chave => {
    const d0 = new Date(chave + 'T00:00:00');
    const d7 = new Date(d0.getTime() + 7*86400000);
    const { vendasBrutas, bruto, despesas } = mapa[chave];
    const liquido = bruto - despesas;
    const open = acumulado;
    acumulado += liquido;
    const close = acumulado;
    return { chave, d0, d7, vendasBrutas, bruto, despesas, liquido, open, close };
  });

  // Só desenha ciclos com venda e que não passem do ciclo atual (evita ciclo futuro/sem movimento)
  const d0Atual = d0DoCiclo(new Date());
  _candlesVisiveis = _candles.filter(c => c.vendasBrutas > 0 && c.d0 <= d0Atual);
}

// ── Monta os segmentos de um candle encadeado ──
// Corpo: abertura (acumulado até o ciclo anterior) até fechamento (abertura + líquido do ciclo)
// Pavio: tamanho da despesa do ciclo, grudado embaixo do corpo se foi lucro, em cima se foi prejuízo
function segmentosCandle(c) {
  const desp = Math.max(c.despesas, 0);
  if (c.liquido >= 0) {
    return {
      cor: 'lucro',
      corpo: [c.open, c.close],
      pavio: [c.open - desp, c.open]
    };
  } else {
    return {
      cor: 'prejuizo',
      corpo: [c.close, c.open],
      pavio: [c.open, c.open + desp]
    };
  }
}

// ── Desenho ──
const LARGURA_CANDLE = 10;
const GAP_CANDLE = 8;
const SLOT = LARGURA_CANDLE + GAP_CANDLE;
const PAD = { top: 24, bottom: 34, left: 10, right: 64 };

function desenharGrafico() {
  const scrollEl = document.getElementById('chart-scroll');
  if (_candlesVisiveis.length === 0) {
    scrollEl.innerHTML = '<div class="empty-state">Sem ciclos com venda pra montar candles.</div>';
    return;
  }

  const larguraTotal = Math.max(scrollEl.clientWidth, PAD.left + PAD.right + _candlesVisiveis.length * SLOT);
  const altura = scrollEl.clientHeight || 300;

  scrollEl.innerHTML = '<div class="chart-inner" style="width:' + larguraTotal + 'px;"><canvas id="candle-canvas"></canvas></div>';
  const canvas = document.getElementById('candle-canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = larguraTotal * dpr;
  canvas.height = altura * dpr;
  canvas.style.width = larguraTotal + 'px';
  canvas.style.height = altura + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const pal = paleta();

  // Domínio vertical: cobre corpo + pavio de todos os candles, com folga
  let vMin = Infinity, vMax = -Infinity;
  _candlesVisiveis.forEach(c => {
    const seg = segmentosCandle(c);
    [...seg.corpo, ...seg.pavio].forEach(v => {
      if (v < vMin) vMin = v;
      if (v > vMax) vMax = v;
    });
  });
  if (!isFinite(vMin) || !isFinite(vMax) || vMin === vMax) { vMin = 0; vMax = 1; }
  const folga = (vMax - vMin) * 0.08;
  vMin -= folga; vMax += folga;

  const chartH = altura - PAD.top - PAD.bottom;
  const chartW = larguraTotal - PAD.left - PAD.right;
  const yParaPx = v => PAD.top + chartH - ((v - vMin) / (vMax - vMin)) * chartH;

  ctx.clearRect(0, 0, larguraTotal, altura);

  // Grade horizontal + rótulos do eixo Y
  const NUM_LINHAS = 6;
  ctx.font = '600 10px Inter, sans-serif';
  ctx.textAlign = 'left';
  for (let i = 0; i <= NUM_LINHAS; i++) {
    const v = vMin + (vMax - vMin) * (i / NUM_LINHAS);
    const y = yParaPx(v);
    ctx.strokeStyle = pal.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD.left, y);
    ctx.lineTo(PAD.left + chartW, y);
    ctx.stroke();
    ctx.fillStyle = pal.axisText;
    ctx.fillText(fmtCompacto(v), PAD.left + chartW + 8, y + 3);
  }

  // linha vertical separando o gráfico dos rótulos
  ctx.strokeStyle = pal.grid;
  ctx.beginPath();
  ctx.moveTo(PAD.left + chartW, PAD.top - 8);
  ctx.lineTo(PAD.left + chartW, altura - PAD.bottom + 8);
  ctx.stroke();

  // Candles
  _candlesVisiveis.forEach((c, idx) => {
    const xCentro = PAD.left + idx * SLOT + SLOT/2;
    const seg = segmentosCandle(c);
    const corCorpo = seg.cor === 'lucro' ? pal.corpoLucro : pal.corpoPrejuizo;
    const corBorda = seg.cor === 'lucro' ? pal.corpoLucroBorda : pal.corpoPrejuizoBorda;

    // pavio (linha fina neutra, representa a despesa)
    const [pDe, pAte] = seg.pavio;
    if (pAte - pDe > 0.01) {
      ctx.strokeStyle = pal.wick;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xCentro, yParaPx(pDe));
      ctx.lineTo(xCentro, yParaPx(pAte));
      ctx.stroke();
    }

    // corpo
    const [cDe, cAte] = seg.corpo;
    const yTopo = yParaPx(cAte);
    const yBase = yParaPx(cDe);
    const altCorpo = Math.max(2, yBase - yTopo);
    ctx.fillStyle = corCorpo;
    ctx.fillRect(xCentro - LARGURA_CANDLE/2, yTopo, LARGURA_CANDLE, altCorpo);
    ctx.strokeStyle = corBorda;
    ctx.lineWidth = 1;
    ctx.strokeRect(xCentro - LARGURA_CANDLE/2, yTopo, LARGURA_CANDLE, altCorpo);

    // rótulo de data (dd/mm) embaixo
    ctx.fillStyle = pal.axisText;
    ctx.font = '9px Inter, sans-serif';
    ctx.textAlign = 'center';
    const dataLabel = c.d0.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
    ctx.fillText(dataLabel, xCentro, altura - PAD.bottom + 16);
  });

  // Interação: toque/clique num candle
  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const idx = Math.floor((x - PAD.left) / SLOT);
    if (idx >= 0 && idx < _candlesVisiveis.length) abrirDetalhe(idx);
  };
}

function fmtCompacto(v) {
  const abs = Math.abs(v);
  if (abs >= 1000) return 'R$ ' + (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'k';
  return 'R$ ' + v.toLocaleString('pt-BR',{maximumFractionDigits:0});
}

function abrirDetalhe(idx) {
  const c = _candlesVisiveis[idx];
  const d0Str = c.d0.toLocaleDateString('pt-BR');
  const d7Str = new Date(c.d7.getTime() - 86400000).toLocaleDateString('pt-BR');
  document.getElementById('detalhe-title').textContent = `${d0Str} — ${d7Str}`;

  const setVal = (id, valor, comCor) => {
    const el = document.getElementById(id);
    el.textContent = fmt(valor);
    if (comCor) el.className = 'detalhe-val' + (valor < 0 ? ' prejuizo' : valor > 0 ? ' lucro' : '');
  };
  setVal('d-vendas', c.vendasBrutas, false);
  setVal('d-bruto', c.bruto, false);
  setVal('d-despesas', c.despesas, false);
  setVal('d-liquido', c.liquido, true);

  const liquidoPct = c.vendasBrutas !== 0 ? (c.liquido / c.vendasBrutas) * 100 : null;
  document.getElementById('d-liquido-pct').textContent = fmtPct(liquidoPct);

  document.getElementById('detalhe-overlay').classList.add('active');
}
function fecharDetalhe() {
  document.getElementById('detalhe-overlay').classList.remove('active');
}

function atualizarResumo() {
  if (_candlesVisiveis.length === 0) return;
  const ultimo = _candlesVisiveis[_candlesVisiveis.length - 1];
  document.getElementById('topbar-sub').textContent =
    `${_candlesVisiveis.length} ciclo${_candlesVisiveis.length !== 1 ? 's' : ''} · até ${ultimo.d0.toLocaleDateString('pt-BR')}`;
}

async function init() {
  try {
    await carregarDados();
    atualizarResumo();
    desenharGrafico();
    const scrollEl = document.getElementById('chart-scroll');
    scrollEl.scrollLeft = scrollEl.scrollWidth;
  } catch (err) {
    document.getElementById('chart-scroll').innerHTML =
      '<div class="empty-state">Erro ao carregar: ' + err.message + '</div>';
    console.error(err);
  }
}

window.addEventListener('resize', () => { if (_candlesVisiveis.length) desenharGrafico(); });

db.auth.getSession().then(({ data }) => {
  if (!data.session) { window.location.href = 'index.html'; return; }
  init();
}).catch(err => {
  console.error('Erro na checagem de sessão:', err);
  document.getElementById('chart-scroll').innerHTML =
    '<div class="empty-state">Erro de sessão: ' + err.message + '</div>';
});
</script>

</body>
</html>
