<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>HuberHorti - Evolução Patrimonial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="utils.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#F2F4F8;
  --card:#FFFFFF;
  --text:#1C1C1E;
  --muted:#8E8E93;
  --border:rgba(0,0,0,0.06);
  --border2:#E5E5EA;
  --verde:#10B981;
  --vermelho:#EF4444;
  --grid:rgba(0,0,0,0.06);
  --axis-text:#8E8E93;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --card:#1C1C1E;
    --text:#F2F2F7;
    --muted:#98989F;
    --border:rgba(255,255,255,0.08);
    --border2:rgba(255,255,255,0.10);
    --verde:#22C55E;
    --vermelho:#F87171;
    --grid:rgba(255,255,255,0.07);
    --axis-text:#8E8E93;
  }
}

body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;height:calc(var(--vh,1vh)*100);display:flex;flex-direction:column;overflow:hidden;overscroll-behavior-y:none;}

.topbar{height:56px;padding:0 18px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-copy{display:flex;flex-direction:column;align-items:center;text-align:center;flex-grow:1;}
.topbar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text);}
.topbar-sub{font-size:10px;color:var(--muted);font-weight:400;margin-top:1px;}
.ios-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer;}

.resumo-wrap{display:flex;gap:10px;padding:0 16px 10px;flex-shrink:0;}
.resumo-card{flex:1;background:var(--card);border-radius:14px;padding:10px 14px;border:0.5px solid var(--border);}
.resumo-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;}
.resumo-val{font-size:15px;font-weight:700;color:var(--text);margin-top:3px;}
.resumo-val.verde{color:var(--verde);}
.resumo-val.vermelho{color:var(--vermelho);}

.card-wrap{flex:1;margin:0 16px 12px;background:var(--card);border-radius:20px;border:0.5px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.legenda{display:flex;gap:14px;align-items:center;padding:10px 14px;border-bottom:0.5px solid var(--border2);flex-shrink:0;}
.legenda-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);}
.legenda-dot{width:8px;height:8px;border-radius:2px;}

.chart-scroll{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;min-height:0;position:relative;}
.chart-inner{height:100%;position:relative;}
canvas#candle-canvas{display:block;height:100%;touch-action:pan-x;}

.empty-state,.loading{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);text-align:center;padding:20px;}

.detalhe-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:999;display:none;align-items:flex-end;justify-content:center;}
.detalhe-overlay.active{display:flex;}
.detalhe-sheet{background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);width:100%;max-width:480px;}
.detalhe-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid var(--border2);}
.detalhe-title{font-size:14px;font-weight:700;color:var(--text);}
.detalhe-close{width:26px;height:26px;border-radius:50%;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.detalhe-close svg{width:12px;height:12px;stroke:var(--text);stroke-width:2.5;fill:none;}
.detalhe-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border2);}
.detalhe-row:last-child{border-bottom:none;}
.detalhe-label{font-size:12px;color:var(--muted);}
.detalhe-val{font-size:13px;font-weight:600;color:var(--text);}
.detalhe-val.verde{color:var(--verde);}
.detalhe-val.vermelho{color:var(--vermelho);}
</style>
</head>
<body>

<div class="topbar">
  <button class="ios-btn" onclick="window.location.href='dashboard.html'">
    <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--text);stroke-width:2.2;fill:none"><path d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
  </button>
  <div class="topbar-copy">
    <div class="topbar-title">Evolução Patrimonial</div>
    <div class="topbar-sub" id="topbar-sub">Carregando...</div>
  </div>
  <div style="width:38px;"></div>
</div>

<div class="resumo-wrap">
  <div class="resumo-card">
    <div class="resumo-label">Lucro Bruto (ciclo atual)</div>
    <div class="resumo-val" id="resumo-bruto">—</div>
  </div>
  <div class="resumo-card">
    <div class="resumo-label">Lucro Líquido (ciclo atual)</div>
    <div class="resumo-val" id="resumo-liquido">—</div>
  </div>
</div>

<div class="card-wrap">
  <div class="legenda">
    <div class="legenda-item"><span class="legenda-dot" style="background:var(--verde);"></span>Lucro</div>
    <div class="legenda-item"><span class="legenda-dot" style="background:var(--vermelho);"></span>Prejuízo</div>
    <div class="legenda-item" style="margin-left:auto;">Toque num candle pra detalhes</div>
  </div>
  <div class="chart-scroll" id="chart-scroll">
    <div class="loading" id="loading-msg">Carregando dados...</div>
  </div>
</div>

<div class="detalhe-overlay" id="detalhe-overlay" onclick="fecharDetalhe()">
  <div class="detalhe-sheet" onclick="event.stopPropagation()">
    <div class="detalhe-header">
      <span class="detalhe-title" id="detalhe-title"></span>
      <button class="detalhe-close" onclick="fecharDetalhe()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="detalhe-row"><span class="detalhe-label">Lucro Bruto (ciclo)</span><span class="detalhe-val" id="d-bruto"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Lucro Líquido (ciclo)</span><span class="detalhe-val" id="d-liquido"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Lucro Bruto (anterior)</span><span class="detalhe-val" id="d-bruto-ant"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Lucro Líquido (anterior)</span><span class="detalhe-val" id="d-liquido-ant"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Despesas do ciclo</span><span class="detalhe-val vermelho" id="d-despesas"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Despesas %</span><span class="detalhe-val" id="d-despesas-pct"></span></div>
    <div class="detalhe-row"><span class="detalhe-label">Lucro Líquido %</span><span class="detalhe-val" id="d-liquido-pct"></span></div>
  </div>
</div>

<script>
const fmt = v => Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtPct = v => (v === null || v === undefined || !isFinite(v)) ? '—' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';

const fixHeight = () => document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
window.addEventListener('resize', fixHeight); fixHeight();

// ── Paleta conforme claro/escuro, lida do CSS pra usar no canvas ──
function paleta() {
  const cs = getComputedStyle(document.documentElement);
  return {
    verde: cs.getPropertyValue('--verde').trim(),
    vermelho: cs.getPropertyValue('--vermelho').trim(),
    grid: cs.getPropertyValue('--grid').trim(),
    axisText: cs.getPropertyValue('--axis-text').trim(),
    text: cs.getPropertyValue('--text').trim()
  };
}

// ── Busca paginada (contorna o limite de 1000 linhas do Supabase) ──
async function fetchTodasLinhas(tabela, colunas, aplicarFiltros) {
  const TAMANHO_PAGINA = 1000;
  let todos = [];
  let pagina = 0;
  while (true) {
    let q = window.db.from(tabela).select(colunas);
    q = aplicarFiltros(q);
    q = q.range(pagina * TAMANHO_PAGINA, pagina * TAMANHO_PAGINA + TAMANHO_PAGINA - 1);
    const { data, error } = await q;
    if (error) throw error;
    if (!data || data.length === 0) break;
    todos = todos.concat(data);
    if (data.length < TAMANHO_PAGINA) break;
    pagina++;
  }
  return todos;
}

// ── Ciclo semanal: quarta 00:00 até a terça seguinte (23:59:59), igual ao resto do sistema ──
function d0DoCiclo(date) {
  const diaSemana = date.getDay(); // 0=Dom ... 3=Qua
  const diasDesdeQuarta = (diaSemana - 3 + 7) % 7;
  const d0 = new Date(date);
  d0.setHours(0,0,0,0);
  d0.setDate(d0.getDate() - diasDesdeQuarta);
  return d0;
}
function chaveCiclo(date) {
  return d0DoCiclo(date).toISOString().slice(0,10); // YYYY-MM-DD do início do ciclo (quarta)
}

let _todosCandles = [];   // um item por ciclo com dados (bruto, liquido, d0, d7)
let _candlesDesenho = []; // a partir do 2º ciclo: {open, close, pavioSup, pavioInf, cor, ciclo}

async function carregarDados() {
  const { data: contas } = await window.db.from('contas_contabeis').select('id, is_despesa');
  const despesaIds = new Set((contas || []).filter(c => c.is_despesa).map(c => c.id));

  const [vendas, lancamentos] = await Promise.all([
    fetchTodasLinhas('pedidos_vendas', 'data, total_lucro', q => q.not('data','is',null)),
    fetchTodasLinhas('livro_caixa', 'data, valor, tipo, conta_id', q => q.not('data','is',null))
  ]);

  // Agrupa por ciclo (chave = data do início do ciclo, quarta-feira)
  const mapa = {}; // chave -> {bruto, despesas}
  function garantir(chave) {
    if (!mapa[chave]) mapa[chave] = { bruto: 0, despesas: 0 };
    return mapa[chave];
  }

  vendas.forEach(v => {
    if (!v.data) return;
    const chave = chaveCiclo(new Date(v.data));
    garantir(chave).bruto += parseFloat(v.total_lucro) || 0;
  });

  lancamentos.forEach(l => {
    if (!l.data) return;
    const isDespesa = l.tipo === 'saida' && l.conta_id && despesaIds.has(l.conta_id);
    if (!isDespesa) return;
    const chave = chaveCiclo(new Date(l.data));
    garantir(chave).despesas += parseFloat(l.valor) || 0;
  });

  const chaves = Object.keys(mapa).sort(); // YYYY-MM-DD ordena cronologicamente
  _todosCandles = chaves.map(chave => {
    const d0 = new Date(chave + 'T00:00:00');
    const d7 = new Date(d0.getTime() + 7*86400000);
    const bruto = mapa[chave].bruto;
    const despesas = mapa[chave].despesas;
    const liquido = bruto - despesas;
    return { chave, d0, d7, bruto, despesas, liquido };
  });

  montarCandlesDesenho();
}

function montarCandlesDesenho() {
  _candlesDesenho = [];
  for (let i = 1; i < _todosCandles.length; i++) {
    const ant = _todosCandles[i-1];
    const atu = _todosCandles[i];
    const a = ant.liquido, b = atu.liquido, c = ant.bruto, d = atu.bruto;
    const open = a;
    const close = a + b;
    const pavioSup = c;
    let pavioInf, cor;
    if (b >= 0) { pavioInf = d; cor = 'verde'; }
    else { pavioInf = 2*b - d; cor = 'vermelho'; }
    _candlesDesenho.push({ ciclo: atu, anterior: ant, open, close, pavioSup, pavioInf, cor });
  }
}

// ── Desenho ──
const LARGURA_CANDLE = 22;
const GAP_CANDLE = 14;
const SLOT = LARGURA_CANDLE + GAP_CANDLE;
const PAD = { top: 20, bottom: 34, left: 10, right: 46 };

function desenharGrafico() {
  const scrollEl = document.getElementById('chart-scroll');
  if (_candlesDesenho.length === 0) {
    scrollEl.innerHTML = '<div class="empty-state">Sem ciclos suficientes pra montar candles (precisa de pelo menos 2 ciclos com movimento).</div>';
    return;
  }

  const larguraTotal = Math.max(scrollEl.clientWidth, PAD.left + PAD.right + _candlesDesenho.length * SLOT);
  const altura = scrollEl.clientHeight || 300;

  scrollEl.innerHTML = '<div class="chart-inner" style="width:' + larguraTotal + 'px;"><canvas id="candle-canvas"></canvas></div>';
  const canvas = document.getElementById('candle-canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = larguraTotal * dpr;
  canvas.height = altura * dpr;
  canvas.style.width = larguraTotal + 'px';
  canvas.style.height = altura + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const pal = paleta();

  // Domínio vertical: min/max de tudo (open, close, pavios) com folga
  let vMin = Infinity, vMax = -Infinity;
  _candlesDesenho.forEach(c => {
    [c.open, c.close, c.pavioSup, c.pavioInf].forEach(v => {
      if (v < vMin) vMin = v;
      if (v > vMax) vMax = v;
    });
  });
  if (vMin === vMax) { vMin -= 1; vMax += 1; }
  const folga = (vMax - vMin) * 0.08;
  vMin -= folga; vMax += folga;

  const chartH = altura - PAD.top - PAD.bottom;
  const chartW = larguraTotal - PAD.left - PAD.right;
  const yParaPx = v => PAD.top + chartH - ((v - vMin) / (vMax - vMin)) * chartH;

  ctx.clearRect(0, 0, larguraTotal, altura);

  // Linha do zero
  ctx.strokeStyle = pal.grid;
  ctx.lineWidth = 1;
  const yZero = yParaPx(0);
  ctx.beginPath();
  ctx.moveTo(PAD.left, yZero);
  ctx.lineTo(PAD.left + chartW, yZero);
  ctx.stroke();
  ctx.fillStyle = pal.axisText;
  ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('R$ 0', PAD.left + chartW + 4, yZero + 3);

  // Grade horizontal (4 linhas) + rótulos
  const NUM_LINHAS = 4;
  for (let i = 0; i <= NUM_LINHAS; i++) {
    const v = vMin + (vMax - vMin) * (i / NUM_LINHAS);
    const y = yParaPx(v);
    ctx.strokeStyle = pal.grid;
    ctx.beginPath();
    ctx.moveTo(PAD.left, y);
    ctx.lineTo(PAD.left + chartW, y);
    ctx.stroke();
    ctx.fillStyle = pal.axisText;
    ctx.fillText(fmtCompacto(v), PAD.left + chartW + 4, y + 3);
  }

  // Candles
  _candlesDesenho.forEach((c, idx) => {
    const xCentro = PAD.left + idx * SLOT + SLOT/2;
    const cor = c.cor === 'verde' ? pal.verde : pal.vermelho;
    const yOpen = yParaPx(c.open);
    const yClose = yParaPx(c.close);
    const ySup = yParaPx(c.pavioSup);
    const yInf = yParaPx(c.pavioInf);

    // pavio (linha vertical fina)
    ctx.strokeStyle = cor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(xCentro, ySup);
    ctx.lineTo(xCentro, yInf);
    ctx.stroke();

    // corpo (retângulo)
    const yTopo = Math.min(yOpen, yClose);
    const yBase = Math.max(yOpen, yClose);
    const altCorpo = Math.max(2, yBase - yTopo);
    ctx.fillStyle = cor;
    ctx.fillRect(xCentro - LARGURA_CANDLE/2, yTopo, LARGURA_CANDLE, altCorpo);

    // rótulo de data (dd/mm) embaixo
    ctx.fillStyle = pal.axisText;
    ctx.font = '9px Inter, sans-serif';
    ctx.textAlign = 'center';
    const dataLabel = c.ciclo.d0.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
    ctx.fillText(dataLabel, xCentro, altura - PAD.bottom + 16);
  });

  // Interação: toque/clique num candle
  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const idx = Math.floor((x - PAD.left) / SLOT);
    if (idx >= 0 && idx < _candlesDesenho.length) abrirDetalhe(idx);
  };
}

function fmtCompacto(v) {
  const abs = Math.abs(v);
  if (abs >= 1000) return (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'k';
  return v.toLocaleString('pt-BR',{maximumFractionDigits:0});
}

function abrirDetalhe(idx) {
  const c = _candlesDesenho[idx];
  const d0Str = c.ciclo.d0.toLocaleDateString('pt-BR');
  const d7Str = new Date(c.ciclo.d7.getTime() - 86400000).toLocaleDateString('pt-BR');
  document.getElementById('detalhe-title').textContent = `${d0Str} — ${d7Str}`;

  const setVal = (id, valor, comCor) => {
    const el = document.getElementById(id);
    el.textContent = fmt(valor);
    if (comCor) el.className = 'detalhe-val' + (valor < 0 ? ' vermelho' : valor > 0 ? ' verde' : '');
  };
  setVal('d-bruto', c.ciclo.bruto, false);
  setVal('d-liquido', c.ciclo.liquido, true);
  setVal('d-bruto-ant', c.anterior.bruto, false);
  setVal('d-liquido-ant', c.anterior.liquido, true);
  setVal('d-despesas', c.ciclo.despesas, false);

  const despesasPct = c.ciclo.bruto !== 0 ? (c.ciclo.despesas / c.ciclo.bruto) * 100 : null;
  const liquidoPct = c.ciclo.bruto !== 0 ? (c.ciclo.liquido / c.ciclo.bruto) * 100 : null;
  document.getElementById('d-despesas-pct').textContent = fmtPct(despesasPct);
  document.getElementById('d-liquido-pct').textContent = fmtPct(liquidoPct);

  document.getElementById('detalhe-overlay').classList.add('active');
}
function fecharDetalhe() {
  document.getElementById('detalhe-overlay').classList.remove('active');
}

function atualizarResumo() {
  if (_todosCandles.length === 0) return;
  const ultimo = _todosCandles[_todosCandles.length - 1];
  document.getElementById('topbar-sub').textContent =
    `${_candlesDesenho.length} ciclo${_candlesDesenho.length !== 1 ? 's' : ''} · até ${ultimo.d0.toLocaleDateString('pt-BR')}`;
  const elBruto = document.getElementById('resumo-bruto');
  const elLiquido = document.getElementById('resumo-liquido');
  elBruto.textContent = fmt(ultimo.bruto);
  elLiquido.textContent = fmt(ultimo.liquido);
  elLiquido.className = 'resumo-val' + (ultimo.liquido < 0 ? ' vermelho' : ultimo.liquido > 0 ? ' verde' : '');
}

async function init() {
  try {
    await carregarDados();
    atualizarResumo();
    desenharGrafico();
    // rola pro candle mais recente
    const scrollEl = document.getElementById('chart-scroll');
    scrollEl.scrollLeft = scrollEl.scrollWidth;
  } catch (err) {
    document.getElementById('chart-scroll').innerHTML =
      '<div class="empty-state">Erro ao carregar: ' + err.message + '</div>';
    console.error(err);
  }
}

window.addEventListener('resize', () => { if (_candlesDesenho.length) desenharGrafico(); });

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
